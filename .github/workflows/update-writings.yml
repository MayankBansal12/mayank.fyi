name: Update writings

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-writings
  cancel-in-progress: false

jobs:
  update-writings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      # The importer uses only Node built-ins; no dependency install is needed.
      - name: Import Substack feed
        run: node scripts/import-substack-feed.mjs

      - name: Open or update writings PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/update-writings
          delete-branch: true
          add-paths: src/content/writing/
          commit-message: 'chore: update writings from Substack'
          title: 'chore: update writings from Substack'
          body: |
            Updates the writing archive from https://mayank12.substack.com/feed.xml.

            Generated by the Update writings workflow. Existing archived posts are
            retained when they no longer appear in the feed.
